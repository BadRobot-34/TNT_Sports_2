<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Antena 3 - Reproductor Clappr</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
  </style>

  <!-- Clappr Core -->
  <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
  <!-- Shaka Player Core -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.6/dist/shaka-player.compiled.js"></script>
  <!-- Plugin Dash Shaka -->
  <script src="https://cdn.jsdelivr.net/npm/dash-shaka-playback@latest/dist/dash-shaka-playback.js"></script>
</head>
<body>

<div id="player"></div>

<script>
  // Función para convertir Base64/Base64URL a HEX corrigiendo caracteres especiales
  function base64ToHex(base64) {
    let b64 = base64.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const raw = atob(b64);
    let hex = '';
    for (let i = 0; i < raw.length; i++) {
      const _hex = raw.charCodeAt(i).toString(16);
      hex += (_hex.length === 1 ? '0' : '') + _hex;
    }
    return hex.toLowerCase();
  }

  // Claves originales en Base64
  const rawKid = "f3df7843080ae743bf865dc5fdf64c68";
  const rawKey = "567c863bc12eb74788ea74888c042e1b";

  const hexKid = base64ToHex(rawKid);
  const hexKey = base64ToHex(rawKey);

  var player = new Clappr.Player({
    source: 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/puehlftk5j/out/v1/f7f0da1ee112481ca0024e6d4dd97f4a/cenc.mpd',
    parentId: '#player',
    plugins: [DashShakaPlayback],
    shakaOnBeforeLoad: function(shakaPlayer) {
      const clearKeysConfig = {};
      clearKeysConfig[hexKid] = hexKey;

      shakaPlayer.configure({
        drm: {
          clearKeys: clearKeysConfig
        }
      });
    },
    autoPlay: true,
    mute: false, // Se inicia en silencio para garantizar el auto-arranque en móviles
    volume: 100,
    width: '100%',
    height: '100%'
  });
</script>

</body>
</html>
